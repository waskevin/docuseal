version: "3.8"

# TOS 7 Docker application - DocuSeal
# Rules: Docker Hub image with a LOCKED version tag; non-root user;
#        no privileged mode, no network_mode: host; data persisted via bind mounts.
# NOTE: container_name is intentionally omitted so that Compose derives a globally
#       unique name (<project>_<service>_1) and never collides with a container the
#       user already runs under the same name.
#
# The volume is mounted at /data/docuseal (not /data) on purpose: that is the image's
# WORKDIR, and DocuSeal writes its generated secrets and SQLite database there.
# Mounting /data instead would make Docker create /data/docuseal as root at container
# creation time, which the non-root container user cannot write to.

services:
  docuseal:
    image: docuseal/docuseal:3.3.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10010:3000"
    volumes:
      - ./data:/data/docuseal
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "(command -v curl >/dev/null && curl -fsS http://127.0.0.1:3000/up) || (command -v wget >/dev/null && wget -q -O /dev/null http://127.0.0.1:3000/up) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

x-app-meta:
  web:
    port: 10010
    protocol: http
